name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, asan]

    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bubblewrap git cmake ninja-build python3 libgl-dev libegl-dev libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor, which bwrap needs.
      # There is no systemd user session here, so sandbox cgroup limits fall back to
      # ulimit and the task-limit test skips itself.
      - name: Allow unprivileged user namespaces for bwrap
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -G Ninja

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
